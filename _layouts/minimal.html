<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.profile.primary_name }}</title>
    <meta name="description" content="{{ site.data.profile.headline | strip_html | strip }}">
    <script>
    // Apply the saved color mode before first paint; blue (day) is the default.
    document.documentElement.classList.add("js");
    try {
        if (localStorage.getItem("theme") === "pink") document.documentElement.setAttribute("data-theme", "pink");
    } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
    {{ content }}
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
