short_bio: >-
  <p>
    Hi! I'm Shunchang (顺昌), a PhD student in the
    <a href="https://tml.epfl.ch/" target="_blank">Theory of Machine Learning (TML) Lab</a> at
    <a href="https://www.epfl.ch" target="_blank">EPFL</a>, advised by
    <a href="https://people.epfl.ch/nicolas.flammarion" target="_blank">Prof. Nicolas Flammarion</a> and
    co-supervised by
    <a href="https://fra31.github.io/" target="_blank">Dr. Francesco Croce</a>.
    Before starting my PhD, I completed a joint Master's degree in Cybersecurity at EPFL and
    <a href="https://www.ethz.ch" target="_blank">ETH Zurich</a>.
  </p>
  <p>
    My research focuses on <strong>AI Alignment</strong>. I'm currently most interested in the
    underlying principles of alignment, that is, understanding and controlling model behavior from
    first principles. Previously, I worked on more applied research around AI safety and copyright.
  </p>
  <p>
    I'm honored to collaborate closely with
    <a href="https://people.epfl.ch/boi.faltings" target="_blank">Prof. Boi Faltings</a> at EPFL,
    and
    <a href="https://las.inf.ethz.ch/krausea" target="_blank">Prof. Andreas Krause</a> and
    <a href="https://www.floriantramer.com/" target="_blank">Prof. Florian Tramer</a> at ETH Zurich.
  </p>
