---
layout: minimal
---
{% assign profile = site.data.profile %}
<div class="shell">
    <main class="profile">
        {% include home/profile.html %}
    </main>

    <aside class="panel" aria-label="Details">
        <div class="panel-bar">
            <button type="button" class="panel-close" data-panel-close>
                <span class="when-wide">Close <span aria-hidden="true">×</span></span>
                <span class="when-narrow"><span aria-hidden="true">←</span> {{ profile.primary_name }}</span>
            </button>
            {% include home/theme_toggle.html class="when-narrow" %}
        </div>
        <section data-view="publications" class="panel-view" aria-labelledby="publications-title">
            {% include home/publications.html %}
        </section>
        <section data-view="about" class="panel-view" aria-labelledby="about-title">
            {% include home/about.html %}
        </section>
    </aside>
</div>

{% include home/visitors.html %}
